name: iOS build

on:
  push:
    paths:
      - ios/**
      - .github/workflows/ios-build.yml
  pull_request:
    paths:
      - ios/**
      - .github/workflows/ios-build.yml
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: Build an Ad Hoc IPA for registered devices
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulator:
    name: Compile for iOS Simulator
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install project tools
        run: |
          brew install xcodegen
          pod --version
      - name: Generate workspace
        run: |
          xcodegen generate --spec project.yml
          pod install
      - name: Build
        run: |
          xcodebuild \
            -workspace Jianxi.xcworkspace \
            -scheme Jianxi \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run core contract tests
        run: |
          simulator_id=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$simulator_id" ]; then
            echo 'No iPhone simulator is available on this runner.' >&2
            exit 1
          fi
          xcodebuild \
            -workspace Jianxi.xcworkspace \
            -scheme Jianxi \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO \
            test

  unsigned_ipa:
    name: Package unsigned device IPA
    needs: simulator
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install project tools
        run: |
          brew install xcodegen
          pod --version
      - name: Generate workspace
        run: |
          xcodegen generate --spec project.yml
          pod install
      - name: Build for physical device without signing
        run: |
          xcodebuild \
            -workspace Jianxi.xcworkspace \
            -scheme Jianxi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/JianxiUnsignedBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package and verify IPA structure
        run: |
          app="$RUNNER_TEMP/JianxiUnsignedBuild/Build/Products/Release-iphoneos/Jianxi.app"
          test -d "$app"
          test -f "$app/Jianxi"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle_id" = dev.rain.laundry.ios
          mkdir -p "$RUNNER_TEMP/JianxiUnsignedPackage/Payload"
          ditto "$app" "$RUNNER_TEMP/JianxiUnsignedPackage/Payload/Jianxi.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/JianxiUnsignedPackage/Payload" "$RUNNER_TEMP/Jianxi-unsigned.ipa"
          unzip -Z1 "$RUNNER_TEMP/Jianxi-unsigned.ipa" | grep -Fxq 'Payload/Jianxi.app/Info.plist'
      - name: Save unsigned IPA for sideload signing
        uses: actions/upload-artifact@v4
        with:
          name: Jianxi-Unsigned-IPA
          path: ${{ runner.temp }}/Jianxi-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  adhoc:
    name: Export signed Ad Hoc IPA
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_ipa }}
    needs: simulator
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: ios
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          for name in IOS_TEAM_ID IOS_ADHOC_PROFILE_BASE64 IOS_P12_BASE64 IOS_P12_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done
      - name: Install project tools
        run: |
          brew install xcodegen
          pod --version
      - name: Generate workspace
        run: |
          xcodegen generate --spec project.yml
          pod install
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
      - name: Install and validate Ad Hoc profile
        run: |
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          printf '%s' "$IOS_ADHOC_PROFILE_BASE64" | base64 -D > "$profile_dir/Jianxi.mobileprovision"
          security cms -D -i "$profile_dir/Jianxi.mobileprovision" -o "$RUNNER_TEMP/JianxiProfile.plist"
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/JianxiProfile.plist")
          if [ "$profile_app_id" != "${IOS_TEAM_ID}.dev.rain.laundry.ios" ]; then
            echo 'Provisioning profile does not match the team and bundle identifier.' >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/JianxiProfile.plist" > /dev/null
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/JianxiProfile.plist")
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          xcodebuild \
            -workspace Jianxi.xcworkspace \
            -scheme Jianxi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Jianxi.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            archive
      - name: Export IPA
        run: |
          cp ExportOptions.plist "$RUNNER_TEMP/JianxiExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $IOS_TEAM_ID" "$RUNNER_TEMP/JianxiExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:dev.rain.laundry.ios $IOS_PROFILE_UUID" "$RUNNER_TEMP/JianxiExportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Jianxi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/JianxiExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/JianxiIPA"
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jianxi-AdHoc-IPA
          path: ${{ runner.temp }}/JianxiIPA/*.ipa
          if-no-files-found: error
          retention-days: 7
